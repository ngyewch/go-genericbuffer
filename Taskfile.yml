version: 3

tasks:
  preBuild:
    cmds:
      - go generate ./...
      - go mod tidy

  build:
    desc: Build
    deps: [ preBuild ]
    cmds:
      - go build .

  dependencyUpdates:
    desc: Show dependency updates
    aliases: [ outdated ]
    deps: [ preBuild ]
    cmds:
      - go list -u -m -json all | go-mod-outdated -update -direct

  mingo:
    cmds:
      - mingo -tests -v
